<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2e9" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23263650'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='27' fill='%23e9c987'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <title>Curator of Larkspur — A Cozy Fantasy Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✦</div><div><span class="brand-title">Larkspur</span><span class="brand-subtitle">ESTATE & GALLERY</span></div></div>
      <div class="side-label">YOUR WORLD</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="gallery"><span class="nav-icon">▧</span>My Gallery <span class="nav-count" id="gallery-count">0</span></button>
        <button class="nav-item" data-view="collection"><span class="nav-icon">◇</span>Collection</button>
        <button class="nav-item" data-view="guild"><span class="nav-icon">⚔</span>Guild & Market</button>
        <button class="nav-item" data-view="estate"><span class="nav-icon">⌂</span>My Mansion</button>
      </nav>
      <div class="side-divider"></div>
      <div class="side-label">YOUR PROGRESS</div>
      <div class="renown-card"><div class="renown-top"><span>Curator renown</span><span id="renown-level">Lv. 1</span></div><div class="progress-track"><div class="progress-fill" id="renown-fill" style="width:22%"></div></div><div class="renown-note" id="renown-note">A promising beginning</div></div>
      <div class="side-visitor"><div class="visitor-portrait">🌿</div><div><div class="visitor-name">Today’s guest</div><div class="visitor-desc" id="guest-name">Mira, a traveling herbalist</div></div><span class="online-dot"></span></div>
      <div class="sidebar-footer"><div class="weather-icon">☀</div><div><strong>Spring, Day <span id="footer-day">1</span></strong><span>Clear skies in Larkspur</span></div></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
        <div class="breadcrumbs"><span>THE LARKSPUR ESTATE</span><i>›</i><strong id="crumb-title">Overview</strong></div>
        <div class="topbar-right"><div class="date-pill"><span>☀</span> Spring · Day <b id="day-number">1</b></div><div class="wallet"><span class="coin">✦</span><b id="gold-count">260</b><small>G</small></div><button class="avatar-button" title="Lord Aurelius"><img src="assets/protagonist.jpg" alt="Lord Aurelius" /></button></div>
      </header>
      <div id="view-container" class="view-container"></div>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal-card" id="modal-card" role="dialog" aria-modal="true"></section></div>
  <script src="game.js"></script>
</body>
</html>
